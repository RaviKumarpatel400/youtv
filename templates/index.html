<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; }
        form { margin: 20px; }
    </style>
</head>
<body>
    <h1>YouTube Video & Audio Downloader</h1>
    <form method="POST">
        <input type="text" name="url" placeholder="Enter YouTube URL" required>
        <br><br>
        <label>
            <input type="radio" name="choice" value="video" checked> Download Video (Best Quality)
        </label>
        <br>
        <label>
            <input type="radio" name="choice" value="audio"> Download Audio (MP3)
        </label>
        <br><br>
        <button type="submit">Download</button>
    </form>
</body>
</html>
